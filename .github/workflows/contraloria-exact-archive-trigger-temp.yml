name: Temporary Contraloria Exact Archive Check

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  check:
    if: startsWith(github.event.issue.title, '[TEMP CONTRALORIA EXACT ARCHIVE]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pypdf
      - run: python scripts/contraloria_exact_archive_temp.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contraloria-exact-archive
          path: output_exact_archive/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
