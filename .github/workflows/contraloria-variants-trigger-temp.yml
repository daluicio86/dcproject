name: Temporary Contraloria Snapshot Variants

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  variants:
    if: startsWith(github.event.issue.title, '[TEMP CONTRALORIA VARIANTS]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python scripts/contraloria_snapshot_variants_temp.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contraloria-variants
          path: output_variants/
          if-no-files-found: warn
          retention-days: 1
