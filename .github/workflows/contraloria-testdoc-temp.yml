name: Temporary Contraloria Storage Test

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  test:
    if: startsWith(github.event.issue.title, '[TEMP CONTRALORIA TESTDOC]')
    runs-on: ubuntu-latest
    steps:
      - name: Test Oracle object storage listing
        run: |
          set -x
          BASE='https://objectstorage.us-ashburn-1.oraclecloud.com/p/Ovj4ah5usLFDMxJZEj8Q1wmkP3ld9SVohrd3t7yhw5Hf0jle-D5RGMG9_fr1Zc9n/n/id08kfinkj3s/b/doccontraloria/o'
          curl -L --connect-timeout 15 --max-time 60 -A 'Mozilla/5.0' -D headers.txt -o listing.json "$BASE?prefix=dl728%2F2023%2FCPM-02-2023%2Fsolucionarios%2F&limit=1000" || true
          echo '--- headers ---'
          cat headers.txt || true
          echo '--- body first 3000 ---'
          head -c 3000 listing.json || true
          echo
          wc -c listing.json || true
      - name: Upload test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testdoc-listing
          path: |
            listing.json
            headers.txt
          if-no-files-found: warn
          retention-days: 1
