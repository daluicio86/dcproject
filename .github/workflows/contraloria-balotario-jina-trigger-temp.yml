name: Temporary Proxied Contraloria Balotario Trigger

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.event.issue.title, '[TEMP CONTRALORIA JINA]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y qpdf
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pypdf

      - name: Download and merge all solucionarios using proxied page listing
        env:
          PAGE_URL: https://r.jina.ai/https://convocatorias.contraloria.gob.pe/solucionarios.html
        run: |
          python scripts/contraloria_balotario_fast_temp.py

      - name: Upload consolidated PDF and audit files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contraloria-balotario-completo-jina
          path: |
            output_fast/BALOTARIO_UNICO_CONTRALORIA_COMPLETO.pdf
            output_fast/manifest.csv
            output_fast/summary.json
            output_fast/failed.txt
            output_fast/page.html
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
